name: 补助库 · 每日更新

on:
  schedule:
    # 10:00 UTC = 多伦多上午 6:00（夏令时）/ 5:00（冬令时）。
    # 比新闻早报早 2 小时，先看钱再读新闻。
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths:
      - "fetch_grants.py"
      - "build_site.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grants-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Toronto
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 上一版快照从 Actions 缓存恢复（不进 git，避免每天和本地抢同一个文件）
      - name: 恢复上次数据（用于比对变更）
        uses: actions/cache@v4
        with:
          path: data
          key: grants-data-${{ github.run_id }}
          restore-keys: |
            grants-data-

      - name: 抓取并结构化
        run: python3 fetch_grants.py

      - name: 构建页面
        run: python3 build_site.py

      - name: 结果摘要
        run: |
          echo "项目数: $(python3 -c "import json;print(json.load(open('data/programs.json'))['count'])")"
          echo "有中文: $(python3 -c "import json;d=json.load(open('data/programs.json'));print(sum(1 for p in d['programs'] if p.get('zh_name')))")"
          echo "新增:   $(python3 -c "import json;print(len(json.load(open('data/changes.json'))['new']))")"

      # 闸门：任何冲突标记都不许发布
      - name: 发布前自检
        run: |
          if grep -rq '<<<<<<<' docs || grep -rq '>>>>>>>' docs; then
            echo "::error title=检测到冲突标记::docs/ 混入了 git 冲突标记"
            exit 1
          fi
          echo "自检通过"

      # 打包必须在归档之前（归档时 rebase 冲突会把标记写进工作区）
      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # 上传成功后 API 列表偶尔滞后（11-23/11-24 连续两天因此找不到产物而发布失败）。
      # 先轮询确认产物可见，再交给 deploy-pages，避免误判为「无产物」。
      - name: 等待 Pages 产物在 API 中可见
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "产物已在 API 中可见（第 $i 次检查）"
              exit 0
            fi
            echo "产物尚未可见，10 秒后重试（$i/12）"
            sleep 10
          done
          echo "::error::产物 2 分钟内仍不可见，终止以避免 deploy-pages 误判"
          exit 1

      - name: 发布到公网
        id: deploy
        uses: actions/deploy-pages@v4
