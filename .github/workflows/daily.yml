name: 补助库 · 每日更新

on:
  schedule:
    # 10:00 UTC = 多伦多上午 6:00（夏令时）/ 5:00（冬令时）。
    # 比新闻早报早 2 小时，先看钱再读新闻。
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths:
      - "fetch_grants.py"
      - "build_site.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grants-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Toronto
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 抓取并结构化
        run: python3 fetch_grants.py

      - name: 构建页面
        run: python3 build_site.py

      - name: 结果摘要
        run: |
          echo "项目数: $(python3 -c "import json;print(json.load(open('data/programs.json'))['count'])")"
          echo "有中文: $(python3 -c "import json;d=json.load(open('data/programs.json'));print(sum(1 for p in d['programs'] if p.get('zh_name')))")"
          echo "新增:   $(python3 -c "import json;print(len(json.load(open('data/changes.json'))['new']))")"

      # 闸门：任何冲突标记都不许发布
      - name: 发布前自检
        run: |
          if grep -rq '<<<<<<<' docs || grep -rq '>>>>>>>' docs; then
            echo "::error title=检测到冲突标记::docs/ 混入了 git 冲突标记"
            exit 1
          fi
          echo "自检通过"

      # 打包必须在归档之前（归档时 rebase 冲突会把标记写进工作区）
      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 归档数据（保留变更历史）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "补助库数据更新 $(TZ=America/Toronto date +%Y-%m-%d)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::远端有新提交，归档未推上（网页已发布）"
            else
              git push || echo "::warning::归档推送失败（网页已发布）"
            fi
          fi

      - name: 发布到公网
        id: deploy
        uses: actions/deploy-pages@v4
